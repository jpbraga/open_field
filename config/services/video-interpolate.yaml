id: video-interpolate
name: Video — frame interpolation (RIFE)
description: >-
  RIFE v4.6 frame interpolation (ncnn). fps_multiplier doubles (or more) the frame rate at the same
  duration; cuts synthesise `insert` in-between frames after each listed source frame (0-based), which
  lengthens the video by those frames while the audio is copied untouched. Cuts apply first, on the
  source frame numbers.
category: video-post
kind: builtin
handler: video_post
handler_args:
  mode: interpolate
  realesrgan_dir: "{app}/tools/realesrgan"
  rife_dir: "{app}/tools/rife"
resources: [gpu]
model: RIFE v4.6 (ncnn)
memory_gb: 8
requires:
  - "{app}/tools/rife/rife-ncnn-vulkan*"

params:
  video: {type: file, required: true, accept: [video], max_mb: 8192}
  fps_multiplier: {type: int, min: 2, max: 8, description: "2: 24 fps becomes 48 fps (default when no cuts are given)"}
  cuts: {type: json, max_length: 200, description: 'e.g. [{"frame": 312, "insert": 8}]'}
  crf: {type: int, default: 16, min: 0, max: 51}
  pix_fmt: {type: enum, values: [yuv420p, yuv420p10le, yuv422p, yuv444p], default: yuv420p}
  keep_audio: {type: bool, default: true}

agent_notes:
  - With cuts, the video gets longer than its untouched audio by insert/fps seconds per cut.
