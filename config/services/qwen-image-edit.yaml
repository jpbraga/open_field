id: qwen-image-edit
name: Qwen Image 2.1 — edit image
description: >-
  Edit by instruction from 1 to 10 input images (Qwen-Image-2.1 Base, mflux on the GPU). Refer to the
  inputs as "image 1", "image 2" in the order sent; the last one sets the aspect ratio when no size is
  given. About 80 s with one input at 40 steps and about 1 MP; guidance above 1 runs the model twice per
  step (twice the time), and larger outputs and more inputs cost more. The output is an RGBA PNG.
category: image
kind: shell
resources: [gpu]
model: Qwen-Image-2.1 Base bf16, edit (mflux 0.24)
requires:
  - ~/.local/bin/mflux-generate-qwen-2.1-edit
  - ~/.cache/huggingface/hub/models--Qwen--Qwen-Image-2.1/snapshots/*/transformer/*.safetensors
memory_gb: "60 + 6*max(0, (width*height/1048576 if width else 1) - 1) + 1.5*len(images)"
# Fitted on 76 jobs on the M5 Max (mean error 5%): a pass of the transformer grows with the output size
# and with each input; guidance > 1 makes two passes per step; strength < 1 skips the start of the schedule.
estimate_s: >-
  8 + (steps - (max(1, int(steps*(1 - strength))) if strength is not None and strength < 1 else 0))
  * (2 if (guidance if guidance is not None else (2.5 if negative_prompt else 1)) > 1 else 1)
  * (width*height/1048576 if width else 1)
  * (1.4 + 0.19*(width*height/1048576 if width else 1) + 0.35*len(images))

params:
  prompt: {type: string, required: true, max_length: 8000, description: "The change, e.g. 'Replace the background with a beach. Keep the face and pose.'"}
  images: {type: files, required: true, max_files: 10, accept: [image], max_mb: 40, description: Input images (repeat the field)}
  mask: {type: file, accept: [image], max_mb: 40, description: "Optional mask over image 1: white = repaint, black = keep"}
  auto_mask: {type: string, max_length: 500, description: "Name an object to repaint ('the red shirt'); ignored with mask"}
  width: {type: int, min: 256, max: 2752, multiple_of: 32, description: Optional; give both width and height or neither}
  height: {type: int, min: 256, max: 2752, multiple_of: 32}
  steps: {type: int, default: 40, min: 1, max: 150}
  strength: {type: float, min: 0.01, max: 1, description: "1.0 (default) redraws from noise; lower keeps more of the input"}
  negative_prompt: {type: string, max_length: 4000}
  guidance: {type: float, min: 0, max: 30}
  seed: {type: int, default: random, min: 0, max: 2147483647}
  quantize: {type: enum, values: [4, 5, 6, 8]}

derive:
  guidance: "guidance if guidance is not None else (2.5 if negative_prompt else None)"
validate:
  - expr: "(width is None) == (height is None)"
    message: give both width and height, or neither (automatic size)
  - expr: "width is None or width*height <= 2400*1792"
    message: at most 2400x1792 pixels (about 4.3 MP)

env:
  HF_HUB_OFFLINE: "1"
  PYTHONUNBUFFERED: "1"

steps:
  - name: edit
    stage: loading Qwen-Image-2.1 (edit)
    holds_model: true
    command: [~/.local/bin/mflux-generate-qwen-2.1-edit, --image-paths, "{images}", --prompt, "{prompt}",
              --steps, "{steps}", --seed, "{seed}", --output, "{work}/out.png"]
    optional_args:
      - {when: width, args: [--width, "{width}", --height, "{height}"]}
      - {when: "strength is not None", args: [--strength, "{strength}"]}
      - {when: mask, args: [--mask-image, "{mask}"]}
      - {when: "auto_mask and not mask", args: [--auto-mask, "{auto_mask}"]}
      - {when: negative_prompt, args: [--negative-prompt, "{negative_prompt}"]}
      - {when: "guidance is not None", args: [--guidance, "{guidance}"]}
      - {when: quantize, args: [--quantize, "{quantize}"]}
    progress:
      kind: regex
      regex: '(?P<done>\d+)/(?P<total>\d+) \['
      # With strength < 1 mflux starts at max(1, int(steps*(1 - strength))): 33 of 40 steps at 0.8, since
      # 40*(1 - 0.8) is 7.999... in floating point.
      total_equals: >-
        [steps] if not strength or strength >= 1
        else [steps - max(1, int(steps*(1 - strength))), int(steps*strength), round(steps*strength)]
      label: "denoising {done}/{total}"
      scale_from: 0.05
      scale_to: 0.95

outputs:
  - {name: image, path: "{work}/out.png", media_type: image/png}

agent_notes:
  - Send the images as repeated `images` multipart fields (or several `files` entries over MCP), in the order the prompt refers to them.
