id: video-upscale-interpolate
name: Vídeo — upscale + interpolação
description: Real-ESRGAN upscaling, then RIFE interpolation at the upscaled size (see the two services alone).
category: video-post
kind: builtin
handler: video_post
handler_args:
  mode: upscale+interpolate
  realesrgan_dir: "{app}/tools/realesrgan"
  rife_dir: "{app}/tools/rife"
resources: [gpu]
model: Real-ESRGAN + RIFE v4.6 (ncnn)
memory_gb: 10
requires:
  - "{app}/tools/realesrgan/realesrgan-ncnn-vulkan*"
  - "{app}/tools/rife/rife-ncnn-vulkan*"

params:
  video: {type: file, required: true, accept: [video], max_mb: 8192}
  scale: {type: enum, values: [2, 3, 4], default: 2}
  model: {type: enum, values: [realesr-animevideov3, realesrgan-x4plus, realesrgan-x4plus-anime], default: realesr-animevideov3}
  out_height: {type: int, min: 144, max: 4320, multiple_of: 2}
  fps_multiplier: {type: int, min: 2, max: 8}
  cuts: {type: json, max_length: 200}
  crf: {type: int, default: 16, min: 0, max: 51}
  pix_fmt: {type: enum, values: [yuv420p, yuv420p10le, yuv422p, yuv444p], default: yuv420p}
  keep_audio: {type: bool, default: true}

validate:
  - expr: "model == 'realesr-animevideov3' or scale == 4"
    message: realesrgan-x4plus models only upscale x4
