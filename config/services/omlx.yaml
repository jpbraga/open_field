id: omlx
name: oMLX — LLMs (OpenAI-compatible proxy)
description: >-
  Proxy to oMLX's OpenAI-compatible API (chat/completions, responses, models...). Point an OpenAI client
  at /proxy/omlx/v1 with an openField key. Calls share the GPU with each other but are refused (409)
  while an image or video job holds it, and vice versa.
category: llm
kind: http_proxy
resources: [gpu]
lock: shared
max_concurrency: 8
model: oMLX models (Inkling 2 Mini, Qwen3.8...)
requires: [~/.omlx/settings.json]
proxy:
  upstream: http://127.0.0.1:8010
  # openField checks the caller's key (its own or oMLX's); oMLX then gets its own API key, read live from
  # its settings, so keys made in openField work here too.
  upstream_auth: headers
  headers: {Authorization: "Bearer {secret.omlx_api_key}"}
  client_base: v1
  timeout_s: 3600

agent_notes:
  - "List the models with GET <base URL>/models; use the model id exactly as listed."
