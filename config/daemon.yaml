# openField daemon. Network and data changes need a restart; services reload with
# POST /api/v1/admin/reload (or the "Recarregar" button in the web UI).
host: 0.0.0.0
port: 8765
public_url: auto   # base of the output URLs handed to agents ("auto": http://<LAN IP>:<port>)
data_dir: ~/.local/share/openfield
min_free_disk_gb: 20

auth:
  # From this machine (localhost / 127.0.0.1 / ::1) no key is needed. From other machines: one of
  # openField's own keys (web UI Access tab or `openfield key --new <name>`; stored hashed in
  # {data_dir}/keys.json) or a key from oMLX's settings (read live from this file, if it exists: its API
  # key as an admin, its sub-keys as agents). Agent keys use the API, MCP and proxies; admin keys also
  # manage keys and system settings.
  omlx_settings: ~/.omlx/settings.json
  loopback_without_key: true
  session_days: 7

retention:
  outputs_hours: 168   # files of finished jobs (7 days)
  records_days: 90     # job and request records

# Large inputs are sent before the job (POST/PUT /api/v1/uploads, resumable) and referenced by id.
uploads:
  ttl_hours: 48        # an upload is deleted this long after its last use
  max_gb: 200          # largest single upload

# Upload and download URLs handed to agents carry a signature, so curl needs no key: an upload URL works while
# the upload exists, an output's download link for this many hours (get_job gives fresh ones).
links_hours: 24

resources:
  gpu:
    description: GPU and unified memory of the M5 Max
    policy: reject
    # Jobs that may run at once. The web UI (Sistema) changes it from 1 to max_slots; every new job still
    # needs a free slot AND enough free memory for its model (memory_gb + memory_margin_gb).
    slots: 1
    max_slots: 4
    memory_check: true
    memory_margin_gb: 4
    # These tools started outside the daemon also count as the GPU being in use.
    detect_external: ["mflux-generate*", "sd-cli", "realesrgan-ncnn-vulkan", "rife-ncnn-vulkan"]

# Values read at use time, for services that must authenticate upstream ({secret.NAME} in templates).
secrets:
  omlx_api_key: {file: ~/.omlx/settings.json, json_path: auth.api_key}
