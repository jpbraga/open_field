<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15181D">
<title>openField</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <!--LOGO-->
    <p>Serviços de IA locais, um campo aberto.<br>Entre com uma chave aceita pelo oMLX.</p>
    <input id="login-key" type="password" autocomplete="current-password" placeholder="Chave" required>
    <button type="submit">Entrar</button>
    <p id="login-error" class="error" hidden></p>
  </form>
</div>

<div id="app" hidden>
  <header class="topbar">
    <!--LOGO-->
    <div id="gpu-pill" class="pill">…</div>
    <div class="meta"><span id="mem"></span><span id="who"></span>
      <button id="logout" class="link">Sair</button></div>
  </header>

  <section id="running" class="running"></section>

  <nav class="tabs">
    <button data-tab="jobs" class="active">Jobs</button>
    <button data-tab="new">Novo job</button>
    <button data-tab="requests">Requisições</button>
    <button data-tab="services">Serviços</button>
    <button data-tab="system">Sistema</button>
  </nav>

  <main>
    <section id="tab-jobs" class="tab">
      <div class="filters">
        <select id="f-service"><option value="">Todos os serviços</option></select>
        <select id="f-state">
          <option value="">Todos os estados</option><option value="running">Executando</option>
          <option value="done">Concluído</option><option value="error">Erro</option><option value="cancelled">Cancelado</option>
        </select>
        <span id="jobs-count" class="muted"></span>
      </div>
      <div id="jobs" class="jobs"></div>
      <div class="pager"><button id="more" class="link" hidden>Carregar mais</button></div>
    </section>

    <section id="tab-new" class="tab" hidden>
      <div class="new-job card">
        <label class="field">Serviço <select id="n-service"></select></label>
        <p id="n-desc" class="muted"></p>
        <form id="n-form" class="form"></form>
        <div id="n-result"></div>
      </div>
    </section>

    <section id="tab-requests" class="tab" hidden>
      <div class="table-wrap"><table class="table">
        <thead><tr><th>Quando</th><th>Serviço</th><th>Requisição</th><th>Modelo</th><th>Status</th><th>Duração</th><th>Cliente</th></tr></thead>
        <tbody id="requests"></tbody>
      </table></div>
    </section>

    <section id="tab-services" class="tab" hidden>
      <div class="filters"><button id="reload" class="secondary">Recarregar serviços</button><span id="reload-msg" class="muted"></span></div>
      <div id="services" class="services"></div>
    </section>

    <section id="tab-system" class="tab" hidden>
      <div id="settings" class="settings"></div>
    </section>
  </main>
</div>

<aside id="drawer" class="drawer" hidden>
  <div class="drawer-head"><h2 id="d-title"></h2><button id="d-close" class="link">Fechar</button></div>
  <div id="d-body"></div>
</aside>

<script src="/static/app.js"></script>
</body>
</html>
