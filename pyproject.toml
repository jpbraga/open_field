[project]
name = "openfield"
version = "0.2.1"
description = "Local daemon that runs AI media services (image, video, LLM proxies) one GPU job at a time, with a web UI, REST API and MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Joao Paulo Braga" }]
keywords = [
    "mcp", "mcp-server", "model-context-protocol", "local-ai", "self-hosted", "apple-silicon", "mlx",
    "image-generation", "video-generation", "text-to-image", "flux", "qwen-image", "sound-effects",
    "generative-ai", "ai-agents", "gpu", "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
    "uvicorn[standard]>=0.54.0",
]

[project.urls]
Homepage = "https://jpbraga.github.io/open_field/"
Documentation = "https://github.com/jpbraga/open_field#readme"
Repository = "https://github.com/jpbraga/open_field"
Issues = "https://github.com/jpbraga/open_field/issues"
Changelog = "https://github.com/jpbraga/open_field/blob/main/CHANGELOG.md"

[project.scripts]
openfield = "openfield.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
