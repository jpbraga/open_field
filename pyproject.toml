[project]
name = "openfield"
version = "0.1.0"
description = "Local daemon that runs AI media services (image, video, LLM proxies) one GPU job at a time, with a web UI, REST API and MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "python-multipart>=0.0.34",
    "pyyaml>=6.0.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
openfield = "openfield.cli:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
